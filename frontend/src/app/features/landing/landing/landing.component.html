<div class="landing-page">
  <div class="landing-stage">
    <img
      class="landing-image"
      src="/skillsync-landing-reference.png"
      alt="SkillSync recruitment platform"
    />

    <button
      type="button"
      class="top-sign-in"
      (click)="exploreJobs()"
    >
      Sign in
    </button>

    <button
      type="button"
      class="glass-button get-started"
      (click)="getStarted()"
    >
      <span>Get Started</span>
      <span class="arrow">&rarr;</span>
    </button>

    <button
      type="button"
      class="glass-button explore-jobs"
      (click)="exploreJobs()"
    >
      <span class="search-icon"></span>
      <span>Explore Jobs</span>
    </button>
  </div>
</div>
