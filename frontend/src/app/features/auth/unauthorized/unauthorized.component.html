<main
  class="grid min-h-screen place-items-center bg-sky-50 px-5 py-10"
>
  <section
    class="w-full max-w-lg rounded-3xl border border-slate-200
           bg-white p-8 text-center shadow-xl shadow-sky-100
           sm:p-12"
  >
    <div
      class="mx-auto grid h-20 w-20 place-items-center
             rounded-full bg-red-50 text-3xl font-bold text-red-600"
    >
      403
    </div>

    <p
      class="mt-7 text-sm font-semibold uppercase tracking-[0.25em]
             text-sky-600"
    >
      Access denied
    </p>

    <h1 class="mt-3 text-3xl font-bold text-slate-900">
      You don't have permission
    </h1>

    <p class="mx-auto mt-4 max-w-md leading-7 text-slate-600">
      Your account is signed in, but your current role is not
      allowed to access this page.
    </p>

    <div
      class="mt-8 flex flex-col justify-center gap-3 sm:flex-row"
    >
      <button
        type="button"
        (click)="goBack()"
        class="rounded-xl border border-slate-300 bg-white
               px-6 py-3 font-semibold text-slate-700
               transition hover:bg-slate-50"
      >
        Go back
      </button>

      <a
        routerLink="/login"
        class="rounded-xl bg-sky-600 px-6 py-3 font-semibold
               text-white transition hover:bg-sky-700"
      >
        Go to login
      </a>
    </div>
  </section>
</main>
